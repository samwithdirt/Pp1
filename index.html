<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Phila Sana — Live Beyond Measure</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
:root{--n:#1E1E6B;--n2:#13134A;--r:#D93025;--r2:#e8453a;--cr:#FAF8F5;--e:cubic-bezier(.4,0,.2,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--cr);color:#1a1a2e;overflow-x:hidden;}
/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(19,19,74,.97);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:68px;border-bottom:2px solid rgba(217,48,37,.4);}
.nb{display:flex;align-items:center;gap:10px;cursor:pointer;}
.nb img{height:44px;filter:brightness(0) invert(1);}
.nb span{color:#fff;font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem;}
.nl{display:flex;gap:2px;list-style:none;}
.nl a{color:rgba(255,255,255,.75);text-decoration:none;font-size:.78rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:7px 13px;border-radius:6px;transition:all .25s;cursor:pointer;}
.nl a:hover,.nl a.on{color:#fff;background:rgba(217,48,37,.25);}
.nc{background:var(--r)!important;color:#fff!important;border-radius:7px!important;}
.nc:hover{background:var(--r2)!important;}
.hb{display:none;flex-direction:column;gap:5px;cursor:pointer;}
.hb span{width:24px;height:2px;background:#fff;border-radius:2px;}
.mn{display:none;position:fixed;top:68px;left:0;right:0;z-index:998;background:rgba(19,19,74,.98);padding:20px 5%;flex-direction:column;gap:4px;border-bottom:2px solid rgba(217,48,37,.3);}
.mn.open{display:flex;}
.mn a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.9rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:12px 16px;border-radius:8px;cursor:pointer;}
.mn a:hover{color:#fff;background:rgba(217,48,37,.2);}
/* PAGES */
.pg{display:none;padding-top:68px;}
.pg.on{display:block;animation:fu .45s var(--e) both;}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* BTN */
.btn{display:inline-block;text-decoration:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.04em;border-radius:8px;padding:13px 30px;transition:all .25s;}
.bp{background:var(--r);color:#fff;}.bp:hover{background:var(--r2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(217,48,37,.4);}
.bo{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4);}.bo:hover{border-color:#fff;background:rgba(255,255,255,.08);}
.bn{background:var(--n);color:#fff;}.bn:hover{background:var(--n2);transform:translateY(-2px);}
/* SEC */
.s{padding:88px 8%;}.sa{background:#fff;}
.tg{display:inline-block;background:rgba(217,48,37,.1);color:var(--r);font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:5px 14px;border-radius:4px;margin-bottom:14px;}
.h2{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.8rem,3.5vw,2.8rem);color:var(--n);line-height:1.2;margin-bottom:14px;}
.sub{font-size:.95rem;line-height:1.75;color:#555;max-width:560px;}
.dv{width:60px;height:3px;background:var(--r);border-radius:2px;margin:16px 0 26px;}
/* TEAM STYLES */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:30px;margin-top:40px;}
.team-card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.05);text-align:center;transition:transform 0.3s;}
.team-card:hover{transform:translateY(-5px);}
.team-img-wrapper{height:300px;overflow:hidden;border-bottom:4px solid var(--r);}
.team-img-wrapper img{width:100%;height:100%;object-fit:cover;}
.team-info{padding:20px;}
.team-info h3{font-family:'Playfair Display', serif;font-size:1.3rem;color:var(--n);margin-bottom:5px;}
.team-info p{color:var(--r);font-weight:600;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;}
/* MEDIA STYLES */
.media-container{display:flex;gap:30px;flex-wrap:wrap;margin-top:40px;}
.media-item{flex:1;min-width:300px;background:#fff;padding:20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.05);}
.media-item img{width:100%;border-radius:8px;margin-bottom:15px;}
.media-item h4{font-family:'Playfair Display', serif;color:var(--n);margin-bottom:10px;}
/* FOOTER ... existing responsive styles ... */
@media(max-width:900px){.nl{display:none;}.hb{display:flex;}.ag,.cg{grid-template-columns:1fr;}}
</style>
</head>
